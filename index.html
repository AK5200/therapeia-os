<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EA">
<script>try{if(localStorage.getItem("tz-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<title>Therapeia Zoi OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="demo/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/os.css">
</head>
<body>
<!--OS-BODY-START-->
<div id="login" class="login" hidden>
  <form id="loginform">
    <h1>Therapeia Zoi OS</h1>
    <p>Sign in with the email you were invited with. We'll send you a one-time link.</p>
    <div class="field"><label for="l-email">Email</label><input id="l-email" type="email" required autocomplete="email"></div>
    <button class="btn primary" type="submit">Send sign-in link</button>
    <p id="l-msg" role="status"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <header class="top" id="top">
    <button class="back" id="back" type="button" aria-label="Back" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="brandmark" id="brandmark"><img src="demo/logo.png" alt=""></span>
    <h1 id="title">Today</h1>
    <span id="modebadge" hidden>Demo</span>
    <button class="themebtn" id="theme" type="button" aria-label="Switch to dark mode"></button>
  </header>
  <main id="view" class="view"></main>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
</div>
<div id="sheet-root"></div>
<div id="toasts" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/modules.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<!--OS-BODY-END-->
</body>
</html>
